<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenCode Chromebook Controller</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #121212; color: #fff; }
    input, textarea, button { width: 100%; margin-top: 10px; padding: 12px; box-sizing: border-box; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; }
    button { background: #0066cc; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #0055bb; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Android OpenCode Cloud Dispatcher</h2>
  
  <label>Personal Access Token (PAT):</label>
  <input type="password" id="pat" placeholder="ghp_xxxxxxxxxxxx">
  
  <label>Repository Name:</label>
  <input type="text" id="repo" value="mccraekaiser48-cell/my-android-project">
  
  <label>Instruction for OpenCode:</label>
  <textarea id="prompt" rows="5" placeholder="Build the next feature for my Android app..."></textarea>
  
  <button onclick="sendTask()">Submit Task to OpenCode</button>
  
  <div id="status"></div>

  <script>
    async function sendTask() {
      const pat = document.getElementById('pat').value;
      const repo = document.getElementById('repo').value;
      const prompt = document.getElementById('prompt').value;
      const status = document.getElementById('status');

      if (!pat || !repo || !prompt) {
        status.innerText = "Please complete all fields.";
        return;
      }

      status.innerText = "Connecting to GitHub Actions cloud runner...";

      try {
        const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/opencode.yml/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${pat}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: { prompt: prompt }
          })
        });

        if (response.ok) {
          status.innerText = "✅ Success! OpenCode is working on your Android app in the cloud.";
        } else {
          const err = await response.json();
          status.innerText = "❌ Error: " + (err.message || response.statusText);
        }
      } catch (e) {
        status.innerText = "❌ Network Error: " + e.message;
      }
    }
  </script>
</body>
</html>
