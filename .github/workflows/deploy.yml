name: Deploy unkernel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the built site at the domain root
        run: |
          set -uo pipefail
          base="https://unkernel.dev"
          out="public"
          mkdir -p "$out"
          curl -fsSL "$base/" -o "$out/index.html" || { echo "index fetch failed"; exit 1; }

          grab() {
            rel="$1"
            [ -f "$out/$rel" ] && return 0
            mkdir -p "$out/$(dirname "$rel")"
            if curl -fsSL "$base/$rel" -o "$out/$rel"; then return 0; fi
            rm -f "$out/$rel"
            return 1
          }

          # Crawl every reference, starting from index.html, so hashed filenames
          # never have to be hardcoded.
          queue="index.html"
          seen=" "
          for round in 1 2 3 4 5 6 7; do
            next=""
            for file in $queue; do
              [ -f "$out/$file" ] || continue
              refs=$(
                grep -ohE '(src|href)="/[^"]+"' "$out/$file" 2>/dev/null | sed 's/.*="//;s/"$//'
                grep -ohE '"?/?assets/[A-Za-z0-9._/-]+' "$out/$file" 2>/dev/null
                grep -ohE '[A-Za-z0-9._-]+-[A-Za-z0-9_-]{6,}\.(js|mjs|css|wasm|woff2|png|svg)' "$out/$file" 2>/dev/null
              )
              for ref in $refs; do
                rel=$(printf '%s' "$ref" | sed 's#^["']*##; s#^/##; s#^\./##')
                [ -z "$rel" ] && continue
                case "$rel" in *.js|*.mjs|*.css|*.wasm|*.woff2|*.png|*.svg|*.webmanifest) : ;; *) continue ;; esac
                case " $seen " in *" $rel "*) continue ;; esac
                seen="$seen$rel "
                [ -f "$out/$rel" ] && continue
                if grab "$rel"; then
                  next="$next $rel"
                else
                  alt="assets/$(basename "$rel")"
                  if [ "$rel" != "$alt" ] && grab "$alt"; then next="$next $alt"; fi
                fi
              done
            done
            queue="$next"
            echo "round $round -> $(echo $queue | wc -w) new files"
            [ -z "$queue" ] && break
          done

          touch "$out/.nojekyll"

          # At the domain root no path rewriting is needed: /assets/... is correct as-is.
          echo "mirrored $(find "$out" -type f | wc -l) files, $(du -sh "$out" | cut -f1)"
          echo "boot modules:"
          find "$out/assets" -name 'boot-*' -printf '%f %s bytes\n'
          test -n "$(find "$out/assets" -name 'boot-*.js' -print -quit)" || { echo "boot module missing"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
