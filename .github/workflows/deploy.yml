name: Deploy unkernel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Mirror the built site at the domain root
        run: |
          set +e
          set -uo pipefail
          base="https://unkernel.dev"
          relay="wss://unkernel-wisp-relay-ivr40r-preview.freebuff.site/wisp"
          out="public"
          mkdir -p "$out"
          curl -fsSL "$base/" -o "$out/index.html"
          if [ ! -s "$out/index.html" ]; then echo "index fetch failed"; exit 1; fi

          grab() {
            rel="$1"
            if [ -f "$out/$rel" ]; then return 0; fi
            mkdir -p "$out/$(dirname "$rel")"
            if curl -fsSL --retry 3 --retry-delay 2 "$base/$rel" -o "$out/$rel"; then return 0; fi
            rm -f "$out/$rel"
            return 1
          }

          # Crawl every reference, starting from index.html, so hashed filenames
          # never have to be hardcoded. distros/ holds the root filesystems.
          queue="index.html"
          seen=" "
          for round in 1 2 3 4 5 6 7 8; do
            next=""
            for file in $queue; do
              if [ ! -f "$out/$file" ]; then continue; fi
              refs=$(
                grep -ohE '(src|href)="/[^"]+"' "$out/$file" 2>/dev/null | sed 's/.*="//;s/"$//'
                grep -ohE '"?/?assets/[A-Za-z0-9._/-]+' "$out/$file" 2>/dev/null
                grep -ohE '"?/?distros/[A-Za-z0-9._-]+' "$out/$file" 2>/dev/null
                grep -ohE 'wasm-inline[A-Za-z0-9._-]*[.]js' "$out/$file" 2>/dev/null
                grep -ohE '[A-Za-z0-9._-]+-[A-Za-z0-9_-]{6,}[.](js|mjs|css|wasm|woff2|png|svg|erofs|lua)' "$out/$file" 2>/dev/null
              )
              for ref in $refs; do
                rel=$(printf %s "$ref" | tr -d '"')
                rel="${rel#./}"
                rel="${rel#/}"
                if [ -z "$rel" ]; then continue; fi
                case "$rel" in *.js|*.mjs|*.css|*.wasm|*.woff2|*.png|*.svg|*.webmanifest|*.erofs|*.lua) : ;; *) continue ;; esac
                case " $seen " in *" $rel "*) continue ;; esac
                seen="$seen$rel "
                if [ -f "$out/$rel" ]; then continue; fi
                if grab "$rel"; then
                  next="$next $rel"
                else
                  alt="assets/$(basename "$rel")"
                  if [ "$rel" != "$alt" ] && grab "$alt"; then next="$next $alt"; fi
                fi
              done
            done
            queue="$next"
            echo "round $round -> $(echo $queue | wc -w) new files"
            if [ -z "$queue" ]; then break; fi
          done

          # Belt and braces: root-level helpers the crawl cannot reach from a
          # string literal. vm-sw.js is the service worker that carries the
          # guest's network.
          for extra in vm-sw.js init.lua assets/wasm-inline-DmWnZdLT.js distros/debian-18e863fd85a63b26.erofs distros/alpine-4253fdcaf3fe289f.erofs; do
            grab "$extra" || echo "optional missing: $extra"
          done

          # The shipped default relay only accepts its own origin, so the guest
          # gets 403 Forbidden for every package. Point it at our own relay,
          # which allows this origin and reaches Debian's mirrors.
          grep -rl 'wss://wisp.pi0.io:6680/' "$out" 2>/dev/null | while read -r f; do
            sed -i "s#wss://wisp.pi0.io:6680/#$relay#g" "$f"
            echo "repointed relay in $f"
          done

          # The isolation worker ships with this repository. GitHub Pages cannot
          # send COOP/COEP, so this worker adds them and is what makes the
          # desktop windows (shared memory, several vCPUs) work here at all.
          cp coi-sw.js coi-boot.js worker-shim.js "$out"/
          ls -l "$out/coi-sw.js" "$out/coi-boot.js" "$out/worker-shim.js"

          # The service worker re-serves same-origin fetches through its preview
          # relay, which drops Range support and makes the kernel refuse the
          # distro image. Its only job here is /vm/ app traffic, so narrow it to
          # that.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("public/vm-sw.js")
          if p.is_file():
              s = p.read_text(encoding="utf-8")
              new = 'if (url.pathname.startsWith("/vm/") && !LEGACY && event.clientId && url.pathname !== SHIM && event.request.mode !== "navigate") event.respondWith(fromPreview(event, url));'
              s2, n = re.subn('if [(]!LEGACY.*?event[.]respondWith[(]fromPreview[(]event, url[)][)];', new, s, count=1, flags=re.S)
              if n:
                  p.write_text(s2, encoding="utf-8")
                  print("narrowed vm-sw.js interception to /vm/")
              else:
                  print("vm-sw.js interception left as-is")
          PY

          # /vm/ documents live in their own worker scope, so they never pass
          # through coi-sw.js. Navigations are not intercepted there anyway, so
          # a listener registered ahead of it can carry the isolation headers.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("public/vm-sw.js")
          if p.is_file():
              s = p.read_text(encoding="utf-8")
              if "kw-coi" not in s:
                  nl = chr(10)
                  q = chr(34)
                  listener = nl.join([
                      "/* kw-coi: guest preview documents need the same isolation headers. */",
                      "self.addEventListener(" + q + "fetch" + q + ", function (event) {",
                      "  var req = event.request;",
                      "  if (req.mode !== " + q + "navigate" + q + ") return;",
                      "  var u = new URL(req.url);",
                      "  if (u.origin !== self.location.origin) return;",
                      "  event.respondWith(",
                      "    fetch(req).then(function (res) {",
                      "      var h = new Headers(res.headers);",
                      "      h.delete(" + q + "content-encoding" + q + ");",
                      "      h.delete(" + q + "content-length" + q + ");",
                      "      h.set(" + q + "Cross-Origin-Opener-Policy" + q + ", " + q + "same-origin" + q + ");",
                      "      h.set(" + q + "Cross-Origin-Embedder-Policy" + q + ", " + q + "require-corp" + q + ");",
                      "      h.set(" + q + "Cross-Origin-Resource-Policy" + q + ", " + q + "cross-origin" + q + ");",
                      "      return new Response(res.body, { status: res.status, statusText: res.statusText, headers: h });",
                      "    }).catch(function () { return fetch(req); })",
                      "  );",
                      "});",
                      "",
                  ])
                  p.write_text(listener + s, encoding="utf-8")
                  print("prepended isolation listener to vm-sw.js")
              else:
                  print("vm-sw.js isolation listener already present")
          PY

          # apt inside the guest reaches a mirror that belongs to unkernel.dev and
          # refuses other origins. The mirror URL lives inside the shipped
          # scripts, and the guest's network stack runs in a worker where an
          # inline page patch never applies, so rewrite the URL in the files
          # themselves: every request then lands on our relay instead.
          python3 - <<'PY'
          import pathlib
          M = "https://mirror.unkernel.dev"
          R = "https://unkernel-wisp-relay-ivr40r-preview.freebuff.site"
          hit = 0
          for pattern in ("*.js", "*.mjs", "*.html", "*.json", "*.lua", "*.webmanifest"):
              for p in pathlib.Path("public").rglob(pattern):
                  try:
                      s = p.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if M in s:
                      p.write_text(s.replace(M, R), encoding="utf-8")
                      hit += 1
                      print("rewrote mirror in", p)
          print("mirror rewrites:", hit)
          PY

          # Install the isolation worker before anything else on the page runs,
          # and drop the old experiment that unregistered workers on load (it
          # would remove the worker this build depends on).
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          if "getRegistrations().then" in s:
              s = s.replace("navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})", "")
              print("removed worker cleanup")
          for name in ("coi-boot.js", "worker-shim.js"):
              tag = '<script src="/' + name + '"></script>'
              if tag not in s:
                  s = s.replace("<head>", "<head>" + chr(10) + "    " + tag, 1)
                  print("injected", name)
          if "getRegistrations().then" in s:
              raise SystemExit("worker cleanup still present")
          p.write_text(s, encoding="utf-8")
          PY

          touch "$out/.nojekyll"

          # At the domain root no path rewriting is needed: /assets/... is correct as-is.
          echo "mirrored $(find "$out" -type f | wc -l) files, $(du -sh "$out" | cut -f1)"
          echo "boot modules:"
          find "$out/assets" -name 'boot-*' -print
          echo "distros:"
          find "$out/distros" -type f -print 2>/dev/null
          echo "relay:"
          grep -roh 'wss://[A-Za-z0-9._/-]*wisp[A-Za-z0-9._/-]*' "$out/assets" 2>/dev/null | sort -u
          echo "isolation worker:"
          grep -c 'coi-boot.js' "$out/index.html"
          grep -c 'worker-shim.js' "$out/index.html"
          if [ -z "$(find "$out/assets" -name 'boot-*.js' -print -quit)" ]; then
            echo "boot module missing"
            exit 1
          fi
          if [ -z "$(find "$out/distros" -name '*.erofs' -print -quit 2>/dev/null)" ]; then
            echo "distro image missing"
            exit 1
          fi
          if [ ! -f "$out/vm-sw.js" ]; then
            echo "vm-sw.js missing"
            exit 1
          fi
          if [ ! -f "$out/coi-sw.js" ] || [ ! -f "$out/coi-boot.js" ] || [ ! -f "$out/worker-shim.js" ]; then
            echo "isolation worker missing"
            exit 1
          fi
          if [ "$(grep -c 'coi-boot.js' "$out/index.html")" != "1" ]; then
            echo "isolation worker not registered by the page"
            exit 1
          fi
          if [ "$(grep -c 'worker-shim.js' "$out/index.html")" != "1" ]; then
            echo "worker shim not installed by the page"
            exit 1
          fi
          if grep -q 'getRegistrations().then' "$out/index.html"; then
            echo "worker cleanup still in the page"
            exit 1
          fi
          echo "mirror ok"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
